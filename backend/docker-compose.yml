version: "3.9"

services:
  # ---------- FastAPI application ----------
  api:
    build: .
    container_name: pilotly-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/home/appuser/app  # live-reload in dev
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

  # ---------- ARQ background worker ----------
  worker:
    build: .
    container_name: pilotly-worker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/home/appuser/app
    command: arq app.workers.settings.WorkerSettings
    restart: unless-stopped

  # ---------- Redis (local dev only — production uses Upstash) ----------
  redis:
    image: redis:7-alpine
    container_name: pilotly-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
